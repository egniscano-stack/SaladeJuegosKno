name: 🚀 Build + Deploy a Hostinger (FTP)

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    name: Compilar y subir a Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔨 Compilar la aplicación
        env:
          VITE_SUPABASE_URL: https://uzoilsngvppytnhtmouo.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV6b2lsc25ndnBweXRuaHRtb3VvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMjMyMzMsImV4cCI6MjA5NTU5OTIzM30.XsxmTf-hLj_yrq-88e9_pJwJh2NnDkETImDjSBfapsk
        run: npm run build

      - name: 📤 Subir a Hostinger vía FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
